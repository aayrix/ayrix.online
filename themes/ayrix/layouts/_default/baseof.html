<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}" data-theme="{{ site.Params.defaultTheme | default `dark` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="app-shell">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{ partial "sidebar.html" . }}
  <div class="app-main">
    {{ partial "topbar.html" . }}
    <main id="main-content" class="app-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  {{ partial "tabbar.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
