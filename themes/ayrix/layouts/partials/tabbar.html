<div class="app-tabbar" role="navigation" aria-label="Mobile">
  <nav>
    {{ range site.Menus.main }}
      {{ $short := .Name }}
      {{ if eq .Identifier "posts" }}{{ $short = "Guides" }}{{ end }}
      <a href="{{ .URL }}" title="{{ .Name }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          {{ if eq .Identifier "home" }}
            <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
          {{ else if eq .Identifier "posts" }}
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
          {{ else if eq .Identifier "tags" }}
            <path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10z"/>
          {{ else if eq .Identifier "categories" }}
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          {{ else if eq .Identifier "about" }}
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
          {{ else }}
            <path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/>
          {{ end }}
        </svg>
        <span>{{ $short }}</span>
      </a>
    {{ end }}
  </nav>
</div>
