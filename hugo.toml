baseURL = "https://ayrix.online/"
languageCode = "en-us"
title = "AYRIX"
theme = "hugo-PaperMod"

summaryLength = 30
enableRobotsTXT = true
copyright = "© {year} AYRIX. All rights reserved."

[pagination]
pagerSize = 5

[params]
env = "production"

description = "AYRIX — technical documentation and developer guides by Aliyan, an Artificial Intelligence student at FAST NUCES. Practical, copy-ready tutorials on Linux, GitHub, Hugo, and modern developer tooling."

keywords = [
  "AYRIX",
  "Linux",
  "GitHub",
  "Hugo",
  "developer tutorials",
  "technical documentation",
  "Arch Linux",
  "Ubuntu",
  "DevOps",
  "static site generators"
]

author = "Aliyan"

defaultTheme = "dark"

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true

mainSections = ["posts"]

# -------------------------
# Home page
# -------------------------

[params.homeInfoParams]
Title = "AYRIX — Technical Documentation & Developer Guides"

Content = """
Hi, I'm **Aliyan** — an Artificial Intelligence student at FAST NUCES and the creator of **AYRIX**.

I write clear, practical, and copy-ready technical guides covering **Linux, GitHub, Hugo, static websites, developer tools, and modern development workflows**.

My goal is simple: make technical problems easier to understand and solutions easier to reproduce.
"""

# -------------------------
# Social links
# -------------------------

[[params.socialIcons]]
name = "github"
url = "https://github.com/aayrix"

[[params.socialIcons]]
name = "email"
url = "mailto:aliyanniazi370@gmail.com"

# -------------------------
# Main navigation
# -------------------------

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1

[[menu.main]]
identifier = "posts"
name = "Publications"
url = "/posts/"
weight = 2

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 3

[[menu.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 4

[[menu.main]]
identifier = "about"
name = "About Me"
url = "/about/"
weight = 5

[[menu.main]]
identifier = "contact"
name = "Contact"
url = "/contact/"
weight = 6

# -------------------------
# Footer
# -------------------------

[params.footer]
hideCopyright = false

# -------------------------
# Markdown / HTML
# -------------------------

[markup]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
